name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend-package-nestjs
        uses: actions/checkout@v4
        with:
          repository: Andersonfrfilho/backend-package-nestjs
          path: backend-package-nestjs

      - name: Set lowercase repository name
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ..
          file: ./domestic-backend-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
            GIT_COMMIT_HASH_FULL=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          no-cache: true
          cache-to: type=registry,ref=ghcr.io/${{ env.REPO_LC }}:buildcache,mode=max

      - name: Update Kubernetes deployment
        if: github.ref == 'refs/heads/main'
        run: |
          git clone https://github.com/Andersonfrfilho/domestic-kubernets.git /tmp/domestic-kubernets
          cd /tmp/domestic-kubernets

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"

          BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          sed -i "s/build.timestamp:.*/build.timestamp: \"$BUILD_TIMESTAMP\"/" worker/worker.deployment.yaml
          sed -i "s/build.commit:.*/build.commit: \"${{ github.sha }}\"/" worker/worker.deployment.yaml

          git add worker/worker.deployment.yaml

          if git diff --cached --exit-code > /dev/null; then
            echo "No changes to commit"
          else
            git commit -m "chore: update worker image to ${{ github.sha }}"
            git push https://x-access-token:${{ secrets.KUBERNETS_PAT }}@github.com/Andersonfrfilho/domestic-kubernets.git
          fi
